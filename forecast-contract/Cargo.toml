[package]
name = "forecast-contract"
version = "0.1.0"
edition = "2021"
description = "T3N Forecast Brief Agent — forecasting/research contract correindo en TEE (bounty skeleton fase 1)"
license = "MIT"
publish = false

[lib]
# cdylib: hace que wasm32-wasip2 emita un WASM *component* (requisito T3N).
# lib:    mantiene la lógica unit-testeable de forma nativa.
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Artifact chico — mantiene el registro bajo el size cap de T3N.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true